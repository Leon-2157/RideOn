name: rideon

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rideon_root_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rideon_db}
      MYSQL_USER: ${MYSQL_USER:-rideon}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rideon_secret}
    # Bind only to loopback so port 3306 is never exposed on external network interfaces.
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - rideon

  rideon-api:
    build:
      context: ./services/rideon-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      PORT: "8080"
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-rideon_db}
      DB_USERNAME: ${MYSQL_USER:-rideon}
      DB_PASSWORD: ${MYSQL_PASSWORD:-rideon_secret}
      JWT_SECRET: ${JWT_SECRET:-change-me-rideon-jwt-secret-key-min-32-chars}
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-168}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-rideon-9eb77}
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL:-https://rideon-9eb77-default-rtdb.asia-southeast1.firebasedatabase.app}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-/app/secrets/firebase-service-account.json}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@rideons.app}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      WA_GATEWAY_URL: http://wa-gateway:3100
      WHATSAPP_GATEWAY_SECRET: ${WHATSAPP_GATEWAY_SECRET:-rideon-wa-internal-secret}
      PAYG_BASE_URL: http://payg:8082
      PAYG_WEBHOOK_SECRET: ${PAYG_WEBHOOK_SECRET:-rideon-payg-internal-secret}
      AI_SERVICE_URL: http://ai-service:8083
      UPLOADS_DIR: /app/uploads
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8088}
      DRIVER_OFFER_SECONDS: ${DRIVER_OFFER_SECONDS:-16}
      DRIVER_NEGATIVE_BALANCE_LIMIT: ${DRIVER_NEGATIVE_BALANCE_LIMIT:-20000}
      WITHDRAW_ADMIN_FEE: ${WITHDRAW_ADMIN_FEE:-2000}
    volumes:
      - uploads_data:/app/uploads
      - ./secrets:/app/secrets:ro,z
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rideon

  payg:
    build:
      context: ./services/payg
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      PORT: "8082"
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-rideon_db}
      DB_USERNAME: ${MYSQL_USER:-rideon}
      DB_PASSWORD: ${MYSQL_PASSWORD:-rideon_secret}
      JWT_SECRET: ${JWT_SECRET:-change-me-rideon-jwt-secret-key-min-32-chars}
      PAYG_WEBHOOK_SECRET: ${PAYG_WEBHOOK_SECRET:-rideon-payg-internal-secret}
      PAYG_STATIC_QRIS: ${PAYG_STATIC_QRIS:-}
      QRIS_EXPIRE_MINUTES: ${QRIS_EXPIRE_MINUTES:-15}
      RIDEON_API_INTERNAL_URL: http://rideon-api:8080
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-rideon-9eb77}
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL:-https://rideon-9eb77-default-rtdb.asia-southeast1.firebasedatabase.app}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-/app/secrets/firebase-service-account.json}
    volumes:
      - ./secrets:/app/secrets:ro,z
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/pay/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rideon

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      PORT: "8083"
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-rideon_db}
      DB_USERNAME: ${MYSQL_USER:-rideon}
      DB_PASSWORD: ${MYSQL_PASSWORD:-rideon_secret}
      JWT_SECRET: ${JWT_SECRET:-change-me-rideon-jwt-secret-key-min-32-chars}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/ai/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rideon

  wa-gateway:
    build:
      context: ./services/wa-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      WHATSAPP_GATEWAY_PORT: "3100"
      WHATSAPP_GATEWAY_SECRET: ${WHATSAPP_GATEWAY_SECRET:-rideon-wa-internal-secret}
      WHATSAPP_WEBHOOK_URL: http://rideon-api:8080/v1/webhooks/wa
      GATEWAY_SANDBOX_MODE: ${GATEWAY_SANDBOX_MODE:-true}
      SESSION_DIR: /app/session
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-rideon_db}
      DB_USERNAME: ${MYSQL_USER:-rideon}
      DB_PASSWORD: ${MYSQL_PASSWORD:-rideon_secret}
      DB_SSL: "false"
    volumes:
      - wa_session_data:/app/session
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rideon

  admin:
    build:
      context: ./apps/admin-RideOn
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8088}
      INTERNAL_API_BASE_URL: http://nginx
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${NEXT_PUBLIC_FIREBASE_DATABASE_URL:-https://rideon-9eb77-default-rtdb.asia-southeast1.firebasedatabase.app}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-rideon-9eb77}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - rideon

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    ports:
      - "${NGINX_HTTP_PORT:-8088}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro,Z
      - ./docker/nginx/templates:/etc/nginx/templates:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - rideon

volumes:
  mysql_data:
  uploads_data:
  wa_session_data:

networks:
  rideon:
    driver: bridge
