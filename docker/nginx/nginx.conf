worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Allow 15 MB uploads for store/menu photos, transfer receipts, and FlexSend receipts.
    client_max_body_size 15M;

    # Populated at container startup from /etc/resolv.conf (Podman aardvark-dns or Docker DNS).
    include /etc/nginx/conf.d/resolver.conf;

    server {
        listen 80;
        server_name api.rideons.app;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        include /etc/nginx/snippets/api_routes.conf;

        location / {
            default_type application/json;
            return 404 '{"error":"Not Found"}\n';
        }
    }

    server {
        listen 80;
        server_name admin.rideons.app;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        include /etc/nginx/snippets/api_routes.conf;

        location / {
            set $upstream_admin http://admin:3001;
            proxy_pass $upstream_admin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Default fallback for localhost and LAN IP testing from physical phones.
    server {
        listen 80 default_server;
        server_name localhost 127.0.0.1 _ nginx;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        include /etc/nginx/snippets/api_routes.conf;

        location / {
            set $upstream_admin_local http://admin:3001;
            proxy_pass $upstream_admin_local;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Production TLS block for Let's Encrypt on OCI VM (rideons.app).
    # When enabling TLS, publish port 443 in compose.yaml (e.g. "443:443") and mount /etc/letsencrypt.
