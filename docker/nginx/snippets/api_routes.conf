# Shared microservice proxy routes included across server blocks.
# Variable $upstream_* targets force nginx to use the dynamic resolver at request time
# so nginx starts even when backend containers are not running yet.

location /v1/ {
    set $upstream_rideon_api http://rideon-api:8080;
    proxy_pass $upstream_rideon_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location /uploads/ {
    set $upstream_rideon_uploads http://rideon-api:8080;
    proxy_pass $upstream_rideon_uploads;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 7d;
    add_header Cache-Control "public, no-transform";
}

location /pay/ {
    set $upstream_payg http://payg:8082;
    proxy_pass $upstream_payg;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location /ai/ {
    set $upstream_ai http://ai-service:8083;
    proxy_pass $upstream_ai;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location = /wa {
    return 301 /wa/;
}

# Strip /wa/ prefix when forwarding to wa-gateway (e.g. /wa/api/send-otp -> /api/send-otp).
location /wa/ {
    set $upstream_wa http://wa-gateway:3100;
    rewrite ^/wa/(.*)$ /$1 break;
    proxy_pass $upstream_wa;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

